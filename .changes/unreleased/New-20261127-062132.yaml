kind: New
body: 'New experimental `$svg` traces an SVG line drawing as a phase runs from 0 to 1, as a stereo signal with left–right on the left side and up–down on the right: `$scopeXY($svg(''builtin/drawings/plover.svg'', $ramp(''20hz'')))` draws it. A drawing with several top-level groups (an editor''s layers) is an animation, one frame per group, played by `frame` in seconds at the file''s `data-fps` (one frame a second without it); `switch` picks whether a new frame waits for the pen to finish its pass (`''wrap''`, the default) or cuts in at once (`''now''`). Try `$svg(''builtin/drawings/shapes.svg'', $ramp(''50hz''), { frame: $ramp(''0.25hz'').range(0, 4) })`. SVG files in your workspace show up in the file explorer and path completion, and the bundled drawings are listed on the Built-ins page.'
