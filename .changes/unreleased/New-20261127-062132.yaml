kind: New
body: 'New experimental `$svg` traces an SVG line drawing as a phase runs from 0 to 1: send its `_x` and `_y` to `$scopeXY` to draw it, as in `$svg(''builtin/drawings/plover.svg'', $ramp(''20hz''))`. SVG files in your workspace show up in the file explorer and path completion, and a bundled plover drawing is listed on the Built-ins page.'
time: 2026-11-27T06:21:32.683115-05:00
