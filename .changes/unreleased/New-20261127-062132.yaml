kind: New
body: 'New experimental `$svg` traces an SVG line drawing as a phase runs from 0 to 1, as a stereo signal with left–right on the left side and up–down on the right: `$scopeXY($svg(''builtin/drawings/plover.svg'', $ramp(''20hz'')))` draws it. A drawing whose top-level groups (an editor''s layers) each hold one frame animates as its `position` sweeps from 0 to 5, like a wavetable: try `$svg(''builtin/drawings/shapes.svg'', $ramp(''50hz''), $sine(''0.1hz'').range(0, 5))`. SVG files in your workspace show up in the file explorer and path completion, and the bundled drawings are listed on the Built-ins page.'
