kind: Breaking
body: |-
    `$reverb`, `$granular`, `$granularSampler` and `$clockedDelay` no longer limit or clip signals past 5 V: they record, repeat and pass them at full level, and a loud reverb no longer pumps or saturates. Only the feedback is still held in check, and each `quality` keeps its bit-depth grit at any level. If a patch relied on the old ceiling, turn the signal down first or follow the module with your own limiting.

    ```js
    // before: a hot chord the reverb held down
    pad: $saw($chord('C3[m7]')).reverb(4)
    // after: turn the chord down to taste first
    pad: $saw($chord('C3[m7]')).amp(0.5).reverb(4)
    ```
