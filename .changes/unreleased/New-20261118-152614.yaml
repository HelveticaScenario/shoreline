kind: New
body: The Output Device list has a System Default choice that follows your computer's default output, so unplugging headphones moves the sound to your speakers and the patch keeps playing. A device you pick by name stays put, even when it is also your computer's default and you plug in headphones. A banner says where the sound went. New installs start on it with no input, and No Input now stays off after a restart.
