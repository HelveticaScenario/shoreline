kind: New
body: 'New `$mi.chiptune`: Plaits'' chiptune engine, chords of square waves over a stepped NES-style triangle bass on its own `bass` output. Patch `trigger` and it arpeggiates the chord instead, a note per trigger, in the direction and octave range `pattern` picks, with `decay` fading each note. Its default `blend` output crossfades the chord into `bass` as `mix` rises.'
