kind: Breaking
body: |-
    `.exp()` holds an exponent below 0 at 0, so its output only ever rises with its input. For the old reciprocal powers, divide 1 by the positive power.

    ```js
    // before
    lfo.exp(-2)
    // after
    $div(1, lfo.exp(2))
    ```
