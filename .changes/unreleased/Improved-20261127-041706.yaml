kind: Improved
body: 'Code examples in the Docs panel read like the editor: hover a name to see its docs and see the same output hints. Go to Definition, or Cmd/Ctrl-click, on a module, global or type, in an example or your patch, opens its page in the Docs panel. Each example also has a copy button, so you can paste it straight into a patch.'
