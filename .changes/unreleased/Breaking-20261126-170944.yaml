kind: Breaking
body: |-
    `$mi.sixOp` plays voices from DX7 `.syx` files: pass a file as its second argument, and add `#` and a voice name to pick one voice from a bank (`'/dx7/rom1a.syx#E.PIANO 1'`). Autocomplete lists every voice of every `.syx` file in your workspace. Plaits' 96 voices are built in, one file each under `builtin/dx7/plaits/`, and `bank` and `patch` are gone.

    ```js
    // before
    keys: $mi.sixOp('c3', { bank: 1, patch: 0 })
    // after
    keys: $mi.sixOp('c3', 'builtin/dx7/plaits/e-piano-1.syx')
    ```
