kind: Breaking
body: |-
    A pattern or multi-output module plugged straight into an input now uses the output that fits it: its trigger in a trigger input, its pitch in a pitch input. Before, it always used its main output, so `$perc(seq)` read the notes' pitch as its trigger. Name the output to keep the old behaviour.

    ```js
    const seq = $cycle($p('c e g'))
    // before: the envelope read the pitch
    $saw('c3').amp($perc(seq)).out()
    // after: name the output to keep that
    $saw('c3').amp($perc(seq._cv)).out()
    ```
