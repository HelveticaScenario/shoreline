kind: New
body: 'New `$mi.va`, Plaits'' virtual analog oscillator as its own module: a square and a saw a `detune` interval apart, with `square` and `shape` morphing each, and a `sync` output of two hard-synced oscillators for tearing sync leads. Its default `_blend` output crossfades `_dual` into `_sync` as `mix` rises.'
