kind: Breaking
body: |-
    `$clock.playhead` is a single channel counting bars (2.5 is halfway through the third bar), and stays sample-accurate however long a song runs. It used to be two channels: the position within the bar and the count of bars. An onset that falls exactly on a sample may now fire one sample later.

    ```js
    // before: position within the bar
    $saw('c3').amp($clock.playhead[0]).out()
    // after
    $saw('c3').amp($clock._playhead.wrap(0, 1)).out()
    ```
