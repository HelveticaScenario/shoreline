kind: New
body: '`$mi.noise` plays Mutable Instruments Plaits'' filtered noise: noise held between ticks of a clock, from stepped crackle to smooth hiss, through a resonant filter you sweep from lowpass to highpass (`filtered`) or two bandpass filters (`bands`). Its `trigger` restarts the clock. Its default `_blend` output crossfades `_filtered` into `_bands` as `mix` rises.'
