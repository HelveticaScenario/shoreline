kind: New
body: '25 wavetables from Mutable Instruments Plaits and Beads now ship with the app: pass a path like `''builtin/tables/mi/organ.wav''` to `$wavetable`, and the editor suggests them as you type `''builtin/''`. The Docs panel''s new Built-ins page describes each table.'
