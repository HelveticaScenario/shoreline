kind: Breaking
body: |-
    `$p` is now `$`, and also works as a template tag, so a pattern can be written `` $`c e g` ``. `$p.arrange` is now `$arrange`.

    ```js
    // before
    $saw($p('c e g')).out()
    $p.arrange([2, $p('c')], [1, $p('e')]).saw().out()
    // after
    $saw($`c e g`).out()
    $arrange([2, $`c`], [1, $`e`]).saw().out()
    ```
