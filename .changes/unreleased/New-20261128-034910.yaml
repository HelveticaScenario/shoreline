kind: New
body: 'New `$comb` filter: a delay tuned to a pitch that rings at it and its harmonics. Use it to tune noise and drums to notes, pluck strings from clicks, or flange; `feedback` sets how long it rings, the same on every note (negative for a hollow, odd-harmonic tone) and `damp` darkens each repeat.'
