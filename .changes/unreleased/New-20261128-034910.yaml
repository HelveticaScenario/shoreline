kind: New
body: 'New `$comb` filter: a delay tuned to a pitch that rings at it and its harmonics. Use it to tune noise and drums to notes, pluck strings from clicks, or flange; `feedback` sets how long it rings (negative for a hollow, odd-harmonic tone), `damp` darkens each repeat, and `evenRing: true` makes every note ring for the same time.'
