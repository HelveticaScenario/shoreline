kind: Breaking
body: |-
    `.$.` and `.$m.` are gone: chain a module directly, and follow it with `.wet(amount)` to blend it with the dry signal.

    ```js
    // before
    $saw('c3').$.lpf('800hz').out()
    $saw('c3').$m.lpf(2.5, '800hz').out()
    // after
    $saw('c3').lpf('800hz').out()
    $saw('c3').lpf('800hz').wet(2.5).out()
    ```
