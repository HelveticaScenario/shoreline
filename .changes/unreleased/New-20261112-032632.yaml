kind: New
body: 'Patterns and multi-output modules plug straight into any input, which takes the output that fits it: with `const seq = $p(''c e g'')`, `$saw(seq).amp($perc(seq))` plays the notes into the pitch and the triggers into the envelope. The editor shows which output each input took; double-click a hint to write it into your code.'
