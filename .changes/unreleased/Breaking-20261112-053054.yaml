kind: Breaking
body: |-
    `$scaleAndShift` and `.amplitude()` are gone. Use `.amp()` to scale and `.shift()` to offset; `$amp`, `$shift` and `$gain` also work as functions, like any other module.

    ```js
    // before
    $scaleAndShift(lfo, 2.5, 1)
    $saw('c3').amplitude(2.5).out()
    // after
    lfo.amp(2.5).shift(1)
    $saw('c3').amp(2.5).out()
    ```
