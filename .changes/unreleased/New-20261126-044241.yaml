kind: New
body: 'New `phaseOffset` on `$mi.waveTerrain` starts the circle part way round the surface, so a `$super` stack of it holds a steady level instead of swelling as the copies drift: `$super(''a2'', (freq, { phaseOffset }) => $mi.waveTerrain(freq, { phaseOffset }))`.'
