kind: New
body: 'Analog-modelled filters in four families, each saturating in its own way and self-oscillating at high resonance: Sallen-Key (`$lpfSk`, `$hpfSk`, `$bpfSk`, `$notchSk`), transistor ladder (`$lpfLadder`, `$hpfLadder`, `$bpfLadder`, `$notchLadder`, `$apfLadder`), diode ladder (`$lpfDiode`, `$hpfDiode`, `$bpfDiode`, `$notchDiode`) and OTA cascade (`$lpfOta`, `$hpfOta`, `$bpfOta`, `$notchOta`, `$apfOta`). Each has `._12db` and `._24db` outputs, the ladder, diode and OTA lowpasses and highpasses add `._6db` and `._18db`, and `drive` raises the level into the filter. On the Sallen-Key filters, `scream` clips the signal inside the filter as well as its resonance.'
