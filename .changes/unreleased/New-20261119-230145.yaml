kind: New
body: The mixer shows a send dial per bus on every track and group, lettered like the buses. Turning one sets that track's send live and writes it into `.track({ sends })`, adding the send if it isn't there yet; letting go at 0 removes it. As with the other mixer controls, ⌃/⌘-drag edits the code only, and ⌃/⌘-right-click puts the code back to what is playing. A send level driven by a signal shows a locked dial that follows the signal, and the dials hide together when the mixer is too short to show them all.
