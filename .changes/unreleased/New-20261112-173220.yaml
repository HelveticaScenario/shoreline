kind: New
body: '`$erratic` is a module of its own, so you can call it directly, like `$erratic($sine(''2hz''), 1)`, as well as through `.erratic()`. Its `mode` now applies to any signal: `''clamp''` and `''blend''` keep a signal without a range of its own within -5 to 5.'
