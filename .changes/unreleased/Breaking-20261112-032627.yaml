kind: Breaking
body: |-
    `$fold` follows the 4ms Ensemble Oscillator's fold, which is gentler at low and middle `amount` settings. Raise `amount` to get close to the old sound.

    ```js
    // before
    $fold($saw('c2'), 2.5).out()
    // after: about the same fold
    $fold($saw('c2'), 3.7).out()
    ```
