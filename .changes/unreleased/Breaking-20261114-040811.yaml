kind: Breaking
body: |-
    `$delay` and `.delay()` return only the delayed signal, without a `buffer` to read extra taps from. For more taps, write the signal into a `$buffer` and read it with `$delayRead`:

    ```js
    // before
    const echo = $delay(src, 0.25)
    $delayRead(echo.buffer, 0.5).out()
    // after
    const buf = $buffer(src, 1)
    $delayRead(buf, 0.25).out()
    $delayRead(buf, 0.5).out()
    ```
