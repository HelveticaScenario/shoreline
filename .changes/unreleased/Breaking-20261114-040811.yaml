kind: Breaking
body: |-
    `$delay` and `.delay()` return only the delayed signal, without a `buffer` to read extra taps from. For another tap, write the signal into a `$buffer` and read it with `$delayRead`; that tap repeats the signal once, without the delay's feedback echoes:

    ```js
    // before
    const echo = $delay(src, 0.25)
    echo.out()
    $delayRead(echo.buffer, 0.5).out()
    // after
    $delay(src, 0.25).out()
    $delayRead($buffer(src, 1), 0.5).out()
    ```
