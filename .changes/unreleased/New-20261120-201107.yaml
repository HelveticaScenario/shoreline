kind: New
body: '`$mi` modules with two outputs now take a `mix` param and play a `blend` output by default, crossfading the main output into the second one as `$macro`''s `mix` did. This covers `$mi.twoOp`, `$mi.waveshaper`, `$mi.waveTerrain`, `$mi.swarm`, `$mi.modal`, `$mi.string`, `$mi.particles`, `$mi.speak`, `$mi.formantVowel`, `$mi.samVowel` and `$mi.lpcVowel`. At the default `mix` of 0, `blend` is the main output, so existing patches sound the same.'
time: 2026-11-20T20:11:07.651918-05:00
