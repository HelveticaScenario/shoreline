kind: New
body: '`$mi` modules with two outputs now take a `mix` param and play a `_blend` output by default: as `mix` rises from 0 to 5, `_blend` crossfades from the main output into the second one. This covers `$mi.twoOp`, `$mi.waveshaper`, `$mi.waveTerrain`, `$mi.swarm`, `$mi.modal`, `$mi.string`, `$mi.particles`, `$mi.speak`, `$mi.formantVowel`, `$mi.samVowel` and `$mi.lpcVowel`. At the default `mix` of 0, `_blend` is the main output, so existing patches sound the same.'
time: 2026-11-20T20:11:07.651918-05:00
