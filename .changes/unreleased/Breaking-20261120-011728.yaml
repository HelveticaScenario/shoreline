kind: Breaking
body: |-
    A bus track's name no longer plays the bus's audio: every track now feeds every bus (at 0 until you turn its send up), so reading a bus from another track would loop it back into itself. The name still works in `sends`, and `.active`, `.level` and `.panning` still read the bus's mixer controls. To process a bus further, chain onto the bus track itself:

    ```js
    // before
    verb: $bus().plate()
    wet: $c(verb).hpf("c3")
    // after
    verb: $bus().plate().hpf("c3")
    ```
