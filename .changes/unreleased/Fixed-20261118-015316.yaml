kind: Fixed
body: The editor fonts that ship with the app now load. Picking one such as Hack, Iosevka or Monaspace Neon used to show a fallback font unless it was installed on your computer. Recursive is now its monospaced Rec Mono Linear style, so code lines up in columns. A new install starts with the line cursor.
