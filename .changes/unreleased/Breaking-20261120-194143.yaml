kind: Breaking
body: |-
    `$supersaw`'s `sync` trigger is replaced by `syncOctaves`, internal sync: each saw runs that many octaves above the note and the note restarts it, so every saw syncs the same way at its own detune and the stack keeps its level. Sweep it for sync tearing. Move a sync trigger's pitch into the note:

    ```js
    // before: saws at c3, restarted by a c2 pulse
    keys: $supersaw('c3', { sync: $pulse('c2') })
    // after: the note restarts saws an octave above it
    keys: $supersaw('c2', { syncOctaves: 1 })
    ```
