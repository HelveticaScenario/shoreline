kind: Breaking
body: |-
    Send to a `$bus` with the new `sends` option of `.out()` and `.outMono()`, which takes a bus, a `[bus, gain]` pair, or an array of them, so one out can feed several buses. `.send()` is gone:

    ```js
    // before
    $saw("c3").send(verb, 2).out();
    // after
    $saw("c3").out({ sends: [verb, 2] });
    ```
