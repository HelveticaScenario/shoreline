kind: Breaking
body: |-
    `.send()` is gone. Send to a `$bus` with the `sends` option of `.track()`, which takes a bus track's name, a `[name, gain]` pair, or an array of them, so one track can feed several buses:

    ```js
    // before
    $saw("c3").send(verb, 2).out();
    // after
    verb: $bus().plate()
    lead: $saw("c3").track({ sends: [verb, 2] })
    ```
