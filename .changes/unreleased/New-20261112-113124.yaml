kind: New
body: '`$round`, `$floor` and `$ceil` are modules of their own, so you can call them directly, like `$floor($saw(''0.5hz'').range(0, 4))`, as well as through `.round()`, `.floor()` and `.ceil()`. `.wet()` after them blends the rounded signal with the original.'
