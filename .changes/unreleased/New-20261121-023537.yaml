kind: New
body: 'New `$super` turns any voice into a detuned, stereo-spread unison stack like `$supersaw`''s: `$super(''c3'', (freq, { phaseOffset }) => $saw(freq, { phaseOffset }))`, or chained onto a signal or pattern like `$delay`: `` $`c3 e3 g3`.super((freq, { phaseOffset }) => $saw(freq, { phaseOffset })) `` stacks each note. Its `unison`, `detune` and `width` options set the copies per note, the semitones between the lowest and highest copy, and how far they fan out.'
