kind: New
body: '`$enosc` plays a bank of sine voices tuned to a scale, after the 4ms Ensemble Oscillator. Pick a scale from `$enosc.scale` or write your own with `$enosc.scale.custom(''0 3 7 10'', true)`, shape the voices with `spread`, `detune`, `crossFm`, `fold`, `cheby` and `segment`, and hear it in stereo, odd voices left and even voices right. Outputs such as `_all`, `_odd` and `_low` give mono mixes of the voices.'
time: 2026-11-12T03:26:30.472889-05:00
