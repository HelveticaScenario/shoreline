body: 'New `$mi.stringMachine`: Plaits'' string machine, eleven four-note chords on string-machine organ voices through a low-pass filter and a stereo ensemble chorus, in one stereo lane. `tone` opens the filter and swirls the chorus in and out, and `registration` blends saw and square footages.'
