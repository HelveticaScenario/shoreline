kind: Breaking
body: |-
    A stereo `.out()` plays a centred signal at its full level on both speakers, as a centred track does in a DAW, where it was 3 dB lower. Patches written for the lower level play 3 dB louder, and their stereo outs' meters read 3 dB higher; scale the signal down to keep the old level.

    ```js
    // before
    $saw('c3').out()
    // after, at the old level
    $saw('c3').amp(3.54).out()
    ```
