kind: Breaking
body: |-
    A stereo track plays a centred signal at its full level on both speakers, as a centred track does in a DAW, where a stereo `.out()` played it 3 dB lower. Patches written for the lower level play 3 dB louder, and their stereo tracks' meters read 3 dB higher; scale the signal down to keep the old level.

    ```js
    // before
    $saw('c3').out()
    // after, at the old level
    lead: $saw('c3').amp(3.54)
    ```
