kind: Breaking
body: |-
    `$phase.mirror`, `$phase.sync`, `$phase.fold` and `$phase.pwm` now follow Strudel's warp modes of the same names, so patches using them sound different. `mirror` always plays the wave forward then back, turning at a point its amount moves; `fold` folds a whole number of times, 2 to 8, so it never clicks at the cycle's end; `sync` rises slowly at first, reaching 16× only at 5; `pwm` changes only slightly. `mirror` and `fold` reshape the wave even at 0, so drop a warp you had set to 0. To keep about the same sound:

    ```js
    // before: a full triangle, and 8.5× sync
    tone: $wavetable("c3", "pad.wav", 0, { phase: $phase.mirror(5, $phase.sync(2.5)) })
    // after
    tone: $wavetable("c3", "pad.wav", 0, { phase: $phase.mirror(2.5, $phase.sync(4.4)) })
    ```
