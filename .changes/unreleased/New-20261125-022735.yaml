kind: New
body: 'Wasp filters, modelled on the circuit of the EDP Wasp: `$lpfWasp`, `$hpfWasp`, `$bpfWasp`, `$notchWasp` and `$apfWasp`. Built from logic-chip inverters, they square the sound up into a fat, lopsided buzz as `drive` overloads their input, and their resonance whistles on the verge of oscillation and squashes as it gets loud, without ever self-oscillating.'
