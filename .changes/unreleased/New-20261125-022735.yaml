kind: New
body: 'Wasp filters, modelled part by part on the EDP Wasp''s filter as Doepfer''s A-124 builds it: `$lpfWasp`, `$hpfWasp`, `$bpfWasp`, `$notchWasp` and `$apfWasp`. Built from logic-chip inverters, they square the sound up into a fat, lopsided buzz as `drive` overloads their input, and their resonance whistles on the verge of oscillation and squashes as it gets loud, without ever self-oscillating. Like the hardware, they pass no DC.'
