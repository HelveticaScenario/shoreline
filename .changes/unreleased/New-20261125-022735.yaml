kind: New
body: 'Wasp filters, modelled part by part on the EDP Wasp''s filter as Doepfer''s A-124 builds it: `$lpfWasp`, `$hpfWasp`, `$bpfWasp`, `$notchWasp` and `$apfWasp`. Built from logic-chip inverters, they turn dirty and erratic when fed a loud signal, and their resonance whistles on the verge of oscillation without ever self-oscillating. They have no `drive`: the level you feed them is the drive. Like the hardware, they pass no DC.'
