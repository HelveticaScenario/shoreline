kind: New
body: 'Write a chord after a note in parentheses, like `c3(maj7)` or `eb(m7 inv1)`, to play all its notes at once, both in patterns and anywhere a signal goes (`$saw(''c3(maj7)'')` is four voices); `invN` inverts a chord. Chords are not allowed in `.scale` patterns.'
