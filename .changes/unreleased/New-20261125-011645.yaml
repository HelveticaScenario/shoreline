kind: New
body: 'Three filters modelled on the North Coast Synthesis Leapfrog, taking the same `resonance`, `drive` and `highRes` as the other analog-modelled filters. `$lpfLeapfrog` is a brick-wall lowpass: a five-pole near-elliptic response with nulls at twice and three times the cutoff, a rippling passband that rings on sharp edges, and resonance that feeds it back through a clipper until it sings about a fourth below the cutoff. `$notchLeapfrog` cuts two nulls a quarter octave either side of its centre, one wide and one narrow, and `$apfLeapfrog` is a four-pole allpass for phasers.'
