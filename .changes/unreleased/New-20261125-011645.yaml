kind: New
body: 'A brick-wall lowpass filter, `$lpfLeapfrog`, modelled on the North Coast Synthesis Leapfrog: a five-pole near-elliptic response with nulls at twice and three times the cutoff, a rippling passband that rings on sharp edges, and `resonance` that feeds it back through a clipper until it sings about a fourth below the cutoff. It takes the same `cutoff`, `resonance`, `drive` and `highRes` as the other analog-modelled lowpasses.'
