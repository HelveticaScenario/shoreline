kind: Breaking
body: |-
    `.mix(channels, mode)` is now `.setLanes(lanes, { mode })`. `$mix` is unchanged.

    ```js
    // before
    $c($sine('c3'), $sine('e3')).mix(1, 'average').out()
    // after
    $c($sine('c3'), $sine('e3')).setLanes(1, { mode: 'average' }).out()
    ```
