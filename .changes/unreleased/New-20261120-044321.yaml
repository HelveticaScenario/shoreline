kind: New
body: 'New `$mi.chords`: Plaits'' chord engine, eleven four-note chords on organ voices that turn into wavetable voices as `waveform` rises. `inversion` revoices the chord upward, and the `root` output plays its root alone. Its default `blend` output crossfades the chord into `root` as `mix` rises.'
