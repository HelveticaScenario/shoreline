kind: Breaking
body: |-
    `$mi.phaseDistortion` no longer starts each new voice with a click: a new note stays silent until its wave first crosses zero, which shaves a fraction of a cycle off its start. Set `waitForZeroCross` to `false` to hear the old start:

    ```js
    // Before
    bass: $mi.phaseDistortion('c2')
    // After, sounding as before
    bass: $mi.phaseDistortion('c2', { waitForZeroCross: false })
    ```
