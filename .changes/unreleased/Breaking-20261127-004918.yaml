kind: Breaking
body: |-
    `$mi.sixOp` plays up to `voices` notes at once, 2 unless you set it (up to 8), so each note's release rings on under the next; a note past the count fades out the oldest. Set `voices: 1` for one note at a time.

    ```js
    // before: each note cut off the last
    keys: $mi.sixOp(seq, 'builtin/dx7/plaits/e-piano-1.syx', { gate: seq })
    // after: the same one note at a time, the last fading out in 5 ms
    keys: $mi.sixOp(seq, 'builtin/dx7/plaits/e-piano-1.syx', { gate: seq, voices: 1 })
    ```
