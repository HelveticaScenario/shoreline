kind: New
body: New `$softClip` rounds off peaks above a knee so a signal never passes its `ceiling` (by default the audio output's full scale), leaving quieter material untouched. Each lane is clipped on its own, so put it after a chord or mix is folded to its final lanes. `knee` sets how gradual the rounding is, from a hard clip at 0 to fully rounded at 5. `_tanh` gives a warmer tanh saturation toward the same ceiling.
