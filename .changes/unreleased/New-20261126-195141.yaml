kind: New
body: New `$softClip` rounds off peaks above a knee so a signal never passes its `ceiling`, leaving quieter material untouched. The ceiling defaults to the audio output's full scale, so `$setEndOfChainCb((mix) => mix.softClip())` catches the whole mix before it clips at the output. `knee` sets how gradual the rounding is, from a hard clip at 0 to fully rounded at 5. `_tanh` gives a warmer tanh saturation toward the same ceiling.
