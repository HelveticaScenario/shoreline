name: CI
on:
    pull_request:
    push:
        branches:
            - master

jobs:
    unit:
        name: Unit tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'yarn'

            # Installs the channel pinned in rust-toolchain.toml — the single
            # source of truth for the version.
            - name: Setup Rust (pinned via rust-toolchain.toml)
              run: rustup toolchain install

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2

            # The vitest suite loads the N-API binding at import time
            # (factories.ts -> @modular/core), so CI must build the native
            # module, which links cpal's Linux hosts and udev.
            # The WGSL validation tests run Dawn (the `webgpu` package) on
            # Mesa's software Vulkan driver, lavapipe, as the runner has no GPU.
            - name: Install system deps (native module; Vulkan — lavapipe)
              uses: ./.github/actions/linux-native-deps
              with:
                  packages: libvulkan1 mesa-vulkan-drivers

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            # The tests need a working binding, not a shipping one, so the
            # build skips link-time optimisation.
            - name: Build native module
              run: yarn build-native
              env:
                  CARGO_PROFILE_RELEASE_LTO: 'off'

            - name: Verify generated grammar is in sync
              run: |
                  yarn build:grammar
                  git diff --exit-code src/main/dsl/miniNotation/grammar.generated.ts

            - name: Unit tests (vitest)
              run: yarn test:unit

            # The vitest run above regenerates the committed Peggy↔Rust parity
            # fixture; fail if the checked-in copy drifted from the grammar.
            - name: Verify committed parser-parity fixture is in sync
              run: git diff --exit-code crates/modular_core/src/pattern_system/__fixtures__/peggy_parser_parity.json

    rust:
        name: Rust tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'yarn'

            # Installs the channel + components (rustfmt, clippy) pinned in
            # rust-toolchain.toml — the single source of truth for the version.
            - name: Setup Rust (pinned via rust-toolchain.toml)
              run: rustup toolchain install

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2

            # Clippy checks the `modular` crate, which links cpal's Linux hosts
            # and udev.
            - name: Install system deps (native module)
              uses: ./.github/actions/linux-native-deps

            # The strudel-parity fixture generator imports @strudel/mini; this
            # job never launches Electron.
            - name: Install dependencies
              run: yarn install --frozen-lockfile
              env:
                  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

            # Generate the strudel-parity fixtures (not committed), then run the
            # pure-DSP crate tests and the engine's own.
            - name: Rust tests (modular_core, modular)
              run: |
                  yarn gen:sp-fixtures
                  cargo test -p modular_core
                  cargo test -p modular --lib
              env:
                  NO_COLOR: 1
                  CARGO_TERM_COLOR: never

            # Formatting and clippy run after the tests and whatever their
            # outcome, so one failure never hides the others' findings.
            - name: Rust formatting (cargo fmt --check)
              if: ${{ !cancelled() }}
              run: cargo fmt -p modular_core -p modular_derive -p modular -- --check

            - name: Clippy
              if: ${{ !cancelled() }}
              run: cargo clippy -p modular_core -p modular_derive -p modular --all-targets

    # The branch ruleset requires this check name; it passes only when every
    # job in `needs` succeeded. It runs even on cancellation, because a skipped
    # required check counts as passing.
    all:
        name: Unit + Rust tests
        if: always()
        needs: [unit, rust]
        runs-on: ubuntu-latest
        steps:
            - name: Require every test job to pass
              run: |
                  echo '${{ toJSON(needs) }}'
                  test -z "$(echo '${{ toJSON(needs.*.result) }}' | tr -d '[]", \n' | sed 's/success//g')"
