[workspace]
resolver = "3"
members = [
    "crates/modular_core",
    "crates/modular_derive",
    "crates/modular",
    "crates/nam_sys",
]
default-members = [
    "crates/modular_core",
    "crates/modular_derive",
    "crates/modular",
]

[workspace.dependencies]
profiling = "1.0"

[workspace.lints.clippy]
all = "deny"

[workspace.lints.cargo]
unused_dependencies = "deny"

[profile.release]
lto = true
# Keep the symbol table in the shipped binary so panic backtraces in
# production resolve function names (Rust-mangled, auto-demangled by
# std::backtrace). Without this, `Backtrace::force_capture` writes only raw
# addresses to the panic log.
strip = "none"
# `line-tables-only` emits `.debug_line` (address → file:line). Where it ends
# up depends on `split-debuginfo`:
#   - macOS:   `scripts/napi-build.mjs` sets `packed` → a `.dSYM` bundle next
#              to the binary (bundled via forge `packageAfterCopy` +
#              `scripts/copy-debuginfo.mjs` so std::backtrace can co-locate
#              it at runtime). Cargo's own default leaves it in the objects.
#   - Linux:   `off`    → DWARF embedded in the `.so` (no extra packaging).
#   - Windows: `packed` → a `.pdb` next to the binary (not auto-bundled
#              yet; ship the `.pdb` with the `.node` for file:line).
debug = "line-tables-only"

# The DSP tests render audio, which runs about five times faster at opt-level
# 1, for a similar rebuild time. Debug app builds keep the dev profile.
[profile.test]
opt-level = 1

# Profile for Tracy profiling - keeps debug symbols for stack traces
[profile.profiling]
inherits = "release"
strip = "none"
debug = 1
